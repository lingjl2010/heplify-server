.commonPipeline: &commonPipeline
  docker:
    build:
      dockerfile: docker/build.Dockerfile
      versionBy:
        - docker/golang/Dockerfile
        - docker/golang/log.go.modified
    volumes:
      - /go
  git:
    lfs: true
    dotGit: true
  runner:
    network: devnet
    cpus: 16
  wework:
    title: tccc voice
  env:
    GOMAXPROCS: 16
  services:
    - docker
    - git-clone-yyds
    - ssh-agent-for-oa

.buildSoftpbxBase: &buildSoftpbxBase
  - name: prepare base softpbx image
    jobs:
    - name: build Homer Heplify Server
      imports: https://git.woa.com/tccc/private-config/blob/master/envs.yaml
      if: '[ "$ORANGE_EVENT" = "push" ]'
      script:
        - docker login csighub.tencentyun.com -u $CSIGHUB_USER -p $CSIGHUB_PASSWORD
        - docker build -t csighub.tencentyun.com/tccc/heplify-server:$ORANGE_COMMIT_SHORT -f softpbx/heplify-server/docker/Dockerfile-tccc .
        - docker push csighub.tencentyun.com/tccc/heplify-server:$ORANGE_COMMIT_SHORT
        - docker tag csighub.tencentyun.com/tccc/heplify-server:$ORANGE_COMMIT_SHORT csighub.tencentyun.com/tccc/heplify-server:latest
        - docker push csighub.tencentyun.com/tccc/heplify-server:latest
    - name: resolve
      type: orange-ci:resolve
      options:
        key: SOFTPBX_BASE

