heplify-server:
  merge_request:
    - stages:
#        - <<: *buildTestImage
      wework:
        silent: true
      services:
        - docker-with-cache
    - <<: *commonPipeline
      stages:
        - name: commit-lint
          jobs:
            - name: make commitlist
              type: git:commitList
              options:
                toFile: commits-data.json
            - name: do commitlint
              image: csighub.tencentyun.com/plugins/commitlint:latest
              settings:
                from_file: commits-data.json
            - name: cleanup
              script: rm commits-data.json
    - <<: *commonPipeline
      wework:
        silent: true
      stages:
        - name: check license
          ifModify: ['go.mod', 'go.sum'] # 仅依赖文件有变化时才跑
          script: make check-license
        - name: local lint
          ifModify: ['**/*.go', 'go.mod', 'go.sum'] # 仅go文件有变化时才跑
          env:
            GOLANGCI_LINT_CACHE: /go/golangci-lint-cache
          script: make lint
  push:
    - stages:
        - <<: *buildSoftpbxBase
      runner:
        network: idc-hk
      services:
        - docker-with-cache
$:
  tag_push:
    - stages:
        - type: git:change-log
          options:
            publishOnly: true
            display:
              feat: 'Features'
              fix: 'Bug Fixes'
              refactor: 'Refactors'
              docs: 'Docs'
              other: 'Other'
          exports:
            latestChangeLog: LATEST_CHANGE_LOG
        - name: upload release
          type: git:release
          options:
            description: ${LATEST_CHANGE_LOG}
        - name: message to self
          type: wework:message
          options:
            message: ${LATEST_CHANGE_LOG}
            lastMsg: "more [Changelog](https://git.woa.com/${ORANGE_REPO_SLUG}/-/releases/${ORANGE_BRANCH})"
    - stages:
        - <<: *buildSoftpbxBase
      runner:
        network: idc-hk
      services:
        - docker-with-cache
      wework:
        silent: true
